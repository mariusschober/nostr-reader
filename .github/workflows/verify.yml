name: Verify Reader
# Host checks follow executable changes; physical/live campaigns remain explicit.
on:
  workflow_dispatch:
  pull_request:
    paths: ['chrome/**', 'android/**', 'rust-core/**', 'mac/**', 'shared/**', 'scripts/**', '.github/workflows/verify.yml']
  push:
    paths: ['chrome/**', 'android/**', 'rust-core/**', 'mac/**', 'shared/**', 'scripts/**', '.github/workflows/verify.yml']
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: chrome/package-lock.json
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: chrome
      - uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
        id: browser
        with:
          chrome-version: stable
      - run: node scripts/run-installed-smoke.mjs
        working-directory: chrome
        env:
          CHROME_BIN: ${{ steps.browser.outputs.chrome-path }}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - run: ./gradlew --no-daemon test lint assembleDebug assembleDebugAndroidTest verify16KbAlignment
        working-directory: android
      - name: Grant this runner access to KVM
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.reader.app.CaptureFlowInstrumentedTest,com.reader.app.ReaderDbMigrationInstrumentedTest,com.reader.app.CaptureMigrationInstrumentedTest,com.reader.app.TransferManagerInstrumentedTest,com.reader.app.SearchInstrumentedTest,com.reader.app.HighlightSessionInstrumentedTest,com.reader.app.TtsNavigationInstrumentedTest
  references:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
        working-directory: rust-core
      - run: swift test
        working-directory: mac
