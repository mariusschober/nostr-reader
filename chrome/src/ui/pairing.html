<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui;background:#FFFCF0;color:#100F0F;max-width:560px;margin:40px auto;padding:20px;text-align:center}
#qr canvas,#qr img{margin:16px auto}
.ok{color:#66800B;font-size:22px}
button{font:inherit;padding:9px 14px;margin:12px 4px;border:1px solid #b7b5ac;border-radius:8px;background:#fff}
</style></head><body>
<h2>Scan with Reader on Android</h2>
<div id="qr"></div>
<div id="state">Preparing…</div>
<button id="cancel" hidden>Cancel pairing</button>
<button id="restart" hidden>Create a new code</button>
<script type="module">
import QRCode from "qrcode";
const state = document.getElementById("state");
const cancel = document.getElementById("cancel");
const restart = document.getElementById("restart");
let sessionId = null;
let stopped = false;

async function begin() {
  stopped = false;
  cancel.hidden = true;
  restart.hidden = true;
  document.getElementById("qr").replaceChildren();
  state.className = "";
  state.textContent = "Checking the pairing relays…";
  const r = await chrome.runtime.sendMessage({kind:"reader-start-pairing"});
  if (!r.ok) {
    state.textContent = "Could not create a pairing code: " + r.error;
    restart.hidden = false;
    return;
  }
  sessionId = r.sessionId;
  const c = document.createElement("canvas");
  document.getElementById("qr").appendChild(c);
  await QRCode.toCanvas(c, JSON.stringify(r.qr), {width: 280, errorCorrectionLevel:"M"});
  state.textContent = "Ready to scan. This code expires in five minutes.";
  cancel.hidden = false;
  await poll();
}

async function poll() {
  if (stopped || !sessionId) return;
  const r = await chrome.runtime.sendMessage({kind:"reader-pairing-status", sessionId});
  if (!r.ok) {
    state.textContent = "Pairing status could not be checked: " + r.error;
  } else {
    state.textContent = r.message;
    if (r.state === "complete") {
      state.className = "ok";
      document.getElementById("qr").replaceChildren();
      cancel.hidden = true;
      stopped = true;
      return;
    }
    if (["expired", "cancelled", "superseded", "missing"].includes(r.state)) {
      document.getElementById("qr").replaceChildren();
      cancel.hidden = true;
      restart.hidden = false;
      stopped = true;
      return;
    }
  }
  setTimeout(poll, 2500);
}

cancel.addEventListener("click", async () => {
  stopped = true;
  if (sessionId) await chrome.runtime.sendMessage({kind:"reader-cancel-pairing", sessionId});
  document.getElementById("qr").replaceChildren();
  state.textContent = "Pairing cancelled.";
  cancel.hidden = true;
  restart.hidden = false;
});
restart.addEventListener("click", begin);
await begin();
</script></body></html>
