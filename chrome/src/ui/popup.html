<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui;background:#FFFCF0;color:#100F0F;min-width:260px;padding:14px}
.ok{color:#66800B}.warn{color:#BC5215}.err{color:#AF3029}
button{background:#100F0F;color:#FFFCF0;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
</style></head><body>
<h3>Reader</h3>
<div id="status">Checking…</div>
<p><button id="open">Setup / Pairing</button></p>
<p><button id="retry">Retry pending</button></p>
<script type="module">
const status = document.getElementById("status");
function render(s) {
  status.replaceChildren();
  const state = document.createElement("span");
  state.className = s.paired ? "ok" : "warn";
  state.textContent = s.paired ? "Connected" : "Not paired";
  status.append(state);
  if (s.paired) {
    const relays = Number(s.relays?.length ?? 0);
    const pending = Number(s.pending ?? 0);
    const delivered = Number(s.delivery?.delivered ?? 0);
    const failed = Number(s.delivery?.failed ?? 0);
    status.append(` · ${relays} relays · ${pending} pending · ${delivered} delivered recently · ${failed} failed`);
  } else {
    status.append(" — scan with Reader on Android");
  }
}
try {
  const s = await chrome.runtime.sendMessage({kind:"reader-status"});
  if (!s?.ok) throw new Error(s?.error ?? "unknown error");
  render(s);
} catch (error) {
  status.className = "err";
  status.textContent = "Could not read Reader status. Reopen the popup. " + String(error).slice(0, 100);
}
document.getElementById("open").onclick = () => chrome.tabs.create({url: chrome.runtime.getURL("src/ui/pairing.html")});
document.getElementById("retry").onclick = async () => {
  try {
    const r = await chrome.runtime.sendMessage({kind:"reader-retry"});
    if (!r?.ok) throw new Error(r?.error ?? "unknown error");
    location.reload();
  } catch (error) {
    status.className = "err";
    status.textContent = "Retry failed. " + String(error).slice(0, 100);
  }
};
</script>  <script type="module" src="./theme.ts"></script>
</body></html>
